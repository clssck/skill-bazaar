name: Sync creator skills

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-creator-skills
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve creator repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-catalog.mjs

      - name: Publish resolved creator versions
        run: |
          if git diff --quiet -- .omp-plugin/marketplace.json; then
            echo "Creator pins are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .omp-plugin/marketplace.json
          git commit -m "Update creator skill pins"
          git push
